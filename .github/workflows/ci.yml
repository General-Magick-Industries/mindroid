name: CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - '**/*.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'
  push:
    branches: [main, develop]
    paths:
      - '**/*.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  pull-requests: write

jobs:
  ci:
    name: Clippy, Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Format
        run: cargo fmt --all

      - name: Clippy
        id: clippy
        continue-on-error: true
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          OUTPUT=$(cargo clippy --all-features --all-targets -- -D warnings 2>&1)
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          echo "$OUTPUT" > clippy-output.txt
          echo "$OUTPUT"

      - name: Comment clippy results on PR
        if: github.event_name == 'pull_request' && steps.clippy.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('clippy-output.txt', 'utf8');

            const body = `## :warning: Clippy: Warnings detected

            <details>
            <summary>Click to expand clippy output</summary>

            \`\`\`
            ${output.slice(0, 60000)}
            \`\`\`

            </details>

            <sub>Generated by cargo clippy</sub>`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Clippy:')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Build
        run: cargo build --all-features

      - name: Test
        run: cargo test --all-features --lib

      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "style: auto-format with cargo fmt"
          git push

      - name: Fail if clippy warnings
        if: steps.clippy.outputs.exit_code != '0'
        run: exit 1
