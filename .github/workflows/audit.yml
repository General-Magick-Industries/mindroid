name: Security Audit

on:
  pull_request:
    branches: [main, develop]

jobs:
  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run cargo audit
        id: audit
        continue-on-error: true
        run: |
          set +e
          OUTPUT=$(cargo audit 2>&1)
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          # Write output to file for the comment step
          echo "$OUTPUT" > audit-output.txt

          # Also write to summary
          if [ $EXIT_CODE -eq 0 ]; then
            echo "### Cargo Audit: No vulnerabilities found" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Cargo Audit: Vulnerabilities detected" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$OUTPUT" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('audit-output.txt', 'utf8');
            const exitCode = '${{ steps.audit.outputs.exit_code }}';
            const status = exitCode === '0' ? 'No vulnerabilities found' : 'Vulnerabilities detected';
            const icon = exitCode === '0' ? ':white_check_mark:' : ':warning:';

            const body = `## ${icon} Cargo Audit: ${status}

            <details>
            <summary>Click to expand full audit log</summary>

            \`\`\`
            ${output.slice(0, 60000)}
            \`\`\`

            </details>

            <sub>Generated by cargo audit</sub>`;

            // Find existing audit comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Cargo Audit:')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if vulnerabilities found
        if: steps.audit.outputs.exit_code != '0'
        run: exit 1
