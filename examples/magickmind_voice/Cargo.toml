[package]
name = "mindroid-example-magickmind-voice"
version = "0.0.1"
edition = "2024"
publish = false

[[bin]]
name = "magickmind_voice"
path = "main.rs"

[features]
default = ["transport-audio", "speech"]
transport-audio = ["dep:rodio", "mindroid/transport-audio"]
speech = ["mindroid/speech"]

[dependencies]
mindroid = { workspace = true, features = ["full"] }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true }
rodio = { workspace = true, optional = true }
