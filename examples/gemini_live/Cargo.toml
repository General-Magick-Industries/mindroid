[package]
name = "mindroid-example-gemini-live"
version = "0.0.1"
edition = "2024"
publish = false

[[bin]]
name = "gemini_live"
path = "main.rs"

[dependencies]
mindroid = { workspace = true, features = ["omni-gemini", "transport-audio", "persistence"] }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tokio-util = "0.7"
