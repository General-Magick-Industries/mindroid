# Chain-of-thought example configuration
# Run with: cargo run -p mindroid-example-cot-trip-agent --bin cot_trip_agent -- --config examples/cot_trip_agent/config_alt.toml

[agent]
agent_id = "your-agent-id-here"
name = "Trip Planner"
persona = "You are a helpful travel planning assistant."
model_type = "fast"
model_ids = ["openrouter/google/gemini-3.1-pro-preview"]
compute_power = 1

[transport]
type = "centrifugo"
url = "wss://dev-centrifugo.magickmind.ai/connection/websocket"

[auth]
type = "apikey"
email = "user@example.com"
password = "your-password-here"
api_key = ""
base_url = "https://dev-magickmind.magickmind.ai"

[memory]
type = "magickmind"
base_url = "https://dev-magickmind.magickmind.ai"

[observer]
type = "log"
level = "info"

# -- LLM Providers -----------------------------------------------------------

[providers.cortex]
base_url = "https://dev-magickmind.magickmind.ai"
api_key = ""

[providers.ollama]
base_url = "http://localhost:11434"

[providers.litellm]
base_url = "https://litellm.globalmagick.com"
api_key = ""

# -- Named Models (per-pipeline LLM config) ----------------------------------

[models.gate]
provider = "litellm"
model = "gpt-4o-mini"

[models.ack]
provider = "cortex"
model = "gpt-4o-mini"
compute_power = 1

[models.respond]
provider = "litellm"
model = "openrouter/google/gemini-3.1-pro-preview"
