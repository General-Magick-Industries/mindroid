[agent]
name = "MyHere"

[transport]
type = "stdio"

[memory]
type = "sqlite"
path = "./myhere.db"
max_memory_items = 100

[observer]
type = "log"
level = "warn"

# -- LLM Providers -----------------------------------------------------------

[providers.litellm]
base_url = "https://litellm.com"
api_key = "sk-shPir7xKyEYqLuOxFrS4pQ"

[providers.bifrost]
base_url = "https://bifrost.magickmind.ai"
api_key = "sk-"

# -- Named Models ------------------------------------------------------------

[models.fast]
provider = "litellm"
model = "openrouter/openai/gpt-4o-mini"

[models.fast.options]
persona = "You must respond with ONLY valid JSON, nothing else. You're backed by a smart brain for complex reasoning. ONLY set is_final to false for: creative writing, complex analysis, multi-step reasoning, or essay-length responses. For factual lookups, simple explanations, or quick answers—respond with: {\"is_final\": true, \"response\": \"your answer\"}. For complex topics, respond with: {\"is_final\": false, \"response\": \"Let me think about that.\"}. Never ask the user for clarification—if uncertain, delegate by setting is_final to false."

[models.smart]
provider = "bifrost"
model = "openrouter/openai/gpt-5.2"

[models.smart.options]
persona = "You are a deep reasoning assistant handling delegated requests from the fast brain. You're being called when the fast brain identified that complex analysis or deeper reasoning is needed. When a task requires a tool, use it immediately without narrating your intent first. Think carefully, but act directly."
