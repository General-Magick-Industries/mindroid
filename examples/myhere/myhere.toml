[agent]
agent_id = "your-agent-id-here"
name = "MyHere"

[transport]
type = "stdio"

[auth]
type = "apikey"
email = "example@example.com"
password = "your-password-here"
api_key = "your-api-key-here"
base_url = "https://dev-bifrost.magickmind.ai"

[memory]
type = "sqlite"
path = "./myhere.db"
max_memory_items = 0

[persona]
type = "magickmind"
persona_id = "your-persona-id-here" # Might be removed for MyHere (?)

[observer]
type = "log"

# -- LLM Providers -----------------------------------------------------------

[providers.litellm]
base_url = "https://litellm.globalmagick.com"
api_key = "your-litellm-api-key-here"

[providers.bifrost]
base_url = "https://dev-bifrost.magickmind.ai"
api_key = "your-bifrost-api-key-here"

# -- Named Models ------------------------------------------------------------

[models.fast]
provider = "litellm"
model = "openrouter/openai/gpt-4o-mini"

[models.fast.options]
persona = "If the question needs deep thinking or reasoning, set is_final to false, otherwise set it to true. Always respond with valid JSON: {\"is_final\": bool, \"response\": string}."

[models.smart]
provider = "bifrost"
model = "openrouter/openai/gpt-4o"

[models.smart.options]
persona = "You are a deep reasoning assistant. When a task requires a tool, use it immediately without narrating your intent first. Think carefully, but act directly."