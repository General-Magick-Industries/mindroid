[agent]
name = "MyHere"

[transport]
type = "stdio"

[memory]
type = "sqlite"
path = "./myhere.db"
max_memory_items = 100

[observer]
type = "log"
level = "debug"

# -- LLM Providers -----------------------------------------------------------

[providers.litellm]
base_url = "https://litellm.globalmagick.com"
api_key = "sk-"

[providers.bifrost]
base_url = "https://dev-bifrost.magickmind.ai"
api_key = "sk-"

# -- Named Models ------------------------------------------------------------

[models.fast]
provider = "litellm"
model = "openrouter/openai/gpt-4o-mini"

[models.fast.options]
persona = "You must respond with ONLY valid JSON, nothing else. ONLY set is_final to false for: creative writing, complex analysis, multi-step reasoning, or essay-length responses. For factual lookups, simple explanations, or quick answers—respond with: {\"is_final\": true, \"response\": \"your answer\"}. For complex topics, respond with: {\"is_final\": false, \"response\": \"always include a very brief note about what you need time for, avoiding asking the user for a response\"}."

[models.smart]
provider = "bifrost"
model = "openrouter/openai/gpt-5.2"

[models.smart.options]
persona = "You are a deep reasoning assistant. When a task requires a tool, use it immediately without narrating your intent first. Think carefully, but act directly."
