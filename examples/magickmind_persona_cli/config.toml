# MagickMind Persona CLI configuration
# Run with: cargo run --example magickmind_persona_cli --features full -- --config examples/magickmind_persona_cli/config.toml

[agent]
agent_id = "69c3690e4044a36452ef6a60"      # MagickMind mindspace ID for this agent
name = "MagickMind Persona CLI"

[transport]
type = "centrifugo"
url = "ws://dev-centrifugo.magickmind.ai/connection/websocket"

[auth]
type = "apikey"
email = "user@example.com"
password = "your-password-here"
api_key = "sk-your-api-key-here"
base_url = "https://dev-bifrost.magickmind.ai"

[memory]
type = "magickmind"
base_url = "https://dev-bifrost.magickmind.ai"

[observer]
type = "log"
level = "info"

# -- Persona (magickmind) ------------------------------------------------------
# Fetches the effective personality from the MagickMind persona service per-request.
# Supports dyadic (per-user) trait blending.

[persona]
type = "magickmind"
persona_id = "69cc9a52a95944be9f86b339"

# -- LiteLLM provider ----------------------------------------------------------
# Routes through the MagickMind LiteLLM proxy. Uses the same auth api_key.

[providers.litellm]
base_url = "https://litellm.globalmagick.com"
api_key = "sk-your-api-key-here"

# -- Named model --------------------------------------------------------------
# `main` is the model used by the CLI pipeline.

[models.main]
provider = "litellm"
model = "openrouter/openai/gpt-5.4"

# Distillation model: cheap/fast LLM for corpus gate + document summarisation.
[models.distill]
provider = "ollama"
model = "gpt-oss"

# -- Corpus (RAG) -------------------------------------------------------------
[corpus]
corpus_id = "69cc9b9b06ab81e24447476a"
