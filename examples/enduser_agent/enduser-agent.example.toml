# End-user platform agent — example config.
#
# Copy to a git-ignored file (e.g. enduser-agent.local.toml) and fill in real
# values before running:
#   cargo run --example enduser_agent --features full -- --config ./enduser-agent.local.toml
#
# auth.type = "enduser" makes the whole magickmind surface route to the
# end-user API (connect proxy, user: channel, /v1/end-user/magickspaces/...).

[agent]
agent_id = "<AGENT_ID>"
name = "Agent"
model_type = "chat"

[transport]
type = "centrifugo"
url = "wss://centrifugo.example.com/connection/websocket"

# Pre-minted end-user JWT (POST /v1/end-users/tokens with a service-user login).
# Re-mint when it expires.
[auth]
type = "enduser"
token = "<END_USER_JWT>"
base_url = "https://bifrost.example.com"

[memory]
type = "magickmind"
base_url = "https://bifrost.example.com"

[persona]
type = "magickmind-prepared-agent"
base_url = "https://bifrost.example.com"

[observer]
type = "log"
level = "info"

[providers.litellm]
base_url = "https://litellm.example.com"
api_key = "<LITELLM_KEY>"

[models.respond]
provider = "litellm"
model = "openrouter/openai/gpt-5-mini"
