# Persona-driven agent configuration
# Run with: cargo run -p mindroid-example-persona-agent --bin persona_agent -- --config examples/persona_agent/neidulus.toml

[agent]
agent_id = "example-agent-id"
name = "Neidulus"

[transport]
type = "centrifugo"
url = "wss://centrifugo.example.com/connection/websocket"
# The transport refuses to send the auth token over plaintext ws://.
# For local development against a non-TLS server, opt in explicitly:
# allow_insecure = true

[auth]
type = "apikey"
email = "user@example.com"
password = "your-password-here"
api_key = "sk-your-api-key-here"
base_url = "https://magickmind.example.com"

[memory]
type = "magickmind"
base_url = "https://magickmind.example.com"

# -- Persona (agent-keyed prepare endpoint) -----------------------------------
# Uses the system prompt MagickMind prepares for agent.agent_id above, verbatim:
# the agent's evolved personality, adapted per user. Replace agent.agent_id with
# an actual agent id; passing a persona id there yields a 404.
# If the persona service is unavailable, the last-good cached prompt is served;
# with no cached prompt, the message fails.

[persona]
type = "magickmind-prepared-agent"
# base_url is optional — falls back to memory.base_url or auth.base_url
# cache_ttl_secs = 600

[observer]
type = "log"
level = "info"

# -- LLM Providers -----------------------------------------------------------

[providers.litellm]
base_url = "https://litellm.example.com"
api_key = "sk-your-api-key-here"

# -- Named Models -------------------------------------------------------------

[models.respond]
provider = "litellm"
model = "your-model-id-here"
