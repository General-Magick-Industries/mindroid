# Persona-driven agent configuration
# Run with: cargo run --example persona_agent --features full -- --config examples/persona_agent/vrugbod.toml

[agent]
agent_id = "example-agent-id"
name = "Vrugbod"

[transport]
type = "centrifugo"
url = "wss://centrifugo.example.com/connection/websocket"
# The transport refuses to send the auth token over plaintext ws://.
# For local development against a non-TLS server, opt in explicitly:
# allow_insecure = true

[auth]
type = "apikey"
email = "user@example.com"
password = "your-password-here"
api_key = "sk-your-api-key-here"
base_url = "https://magickmind.example.com"

[memory]
type = "magickmind"
base_url = "https://magickmind.example.com"

# -- Persona (magickmind runtime service) -------------------------------------
# Fetches the effective personality per-request with dyadic per-user adaptation.
# Replace persona_id with an actual persona from the magickmind persona service.
# If the persona service is unavailable, the last-good cached prompt is served;
# with no cached prompt, the message fails.

[persona]
type = "magickmind"
persona_id = "example-persona-id"
# base_url is optional — falls back to memory.base_url or auth.base_url

[observer]
type = "log"
level = "info"

# -- LLM Providers -----------------------------------------------------------

[providers.litellm]
base_url = "https://litellm.example.com"
api_key = "sk-your-api-key-here"

# -- Named Models -------------------------------------------------------------

[models.respond]
provider = "litellm"
model = "your-model-id-here"
