# Voice agent configuration
# Run with: cargo run --example voice_agent --features full -- --config examples/voice_agent.toml
#
# API keys can be set here or via environment variables:
#   OPENAI_API_KEY   — overrides providers.openai.api_key
#   DEEPGRAM_API_KEY — overrides providers.deepgram.api_key

[agent]
agent_id = "voice-agent"
name = "Voice Agent"
persona = "You are a helpful voice assistant. Keep responses brief and conversational."

[transport]
type = "audio"

[auth]
type = "static"
token = "dev"

[memory]
type = "none"

[observer]
type = "log"
level = "info"

# -- Providers (API endpoints) ------------------------------------------------

[providers.openai]
base_url = "https://api.openai.com/v1"
# api_key = "sk-..."                     # or set OPENAI_API_KEY env var

[providers.deepgram]
base_url = "https://api.deepgram.com"
api_key = "your-deepgram-api-key-here"                        # or set DEEPGRAM_API_KEY env var

[providers.litellm]
base_url = "https://litellm.globalmagick.com"
api_key = "sk-your-api-key-here"

# -- Named Models (per-pipeline config) ---------------------------------------

[models.stt]
provider = "deepgram"
model = "nova-2"

[models.tts]
provider = "deepgram"
model = "aura-stella-en" # aura-asteria-en, aura-stella-en, aura-athena-en

[models.respond]
provider = "litellm"
model = "openrouter/openai/gpt-5-mini"

# -- Tools (OS control) -------------------------------------------------------

[tools.shell]
enabled = true
timeout_secs = 30
allowed_commands = [
    "ls", "cat", "echo", "pwd", "find", "grep", "head", "tail", "wc", "sort",
    "uniq", "sed", "awk", "curl", "git", "which", "env", "date", "uname", "whoami",
    "mkdir", "touch", "rm", "cp", "mv", "ps", "kill", "pkill", "df", "du", "free",
    "sh", "bash", "zsh", "true", "false", "test",
    # Media / desktop control
    "playerctl", "brightnessctl", "xdg-open",
]
# Describe your system setup so the agent picks the right commands immediately.
# Without this, the agent will probe with `which` to discover available tools.
instructions = """
Music player: Favourite is Spotify (if asked to drop the needle, play random from this without asking).
Brightness: brightnessctl.
"""

[tools.open]
enabled = true
