[package]
name = "mindroid-example-voice-agent"
version = "0.0.1"
edition = "2024"
publish = false

[[bin]]
name = "voice_agent"
path = "main.rs"

[features]
default = ["transport-audio", "speech"]
transport-audio = ["dep:rodio", "mindroid/transport-audio"]
speech = ["mindroid/speech"]

[dependencies]
mindroid = { workspace = true, features = ["llm-client", "speech"] }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
serde_json = { workspace = true }
rodio = { workspace = true, optional = true }
